[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-interaction-order"
version = "0.1.0"
description = "Relative particle attention and matched JetClass-II baselines"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.4", "numpy"
]

[project.optional-dependencies]
weaver = ["weaver-core>=0.5.3"]
test = ["pytest>=8", "weaver-core>=0.5.3"]

[tool.setuptools.package-data]
"aio.models.jets" = ["presets/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
